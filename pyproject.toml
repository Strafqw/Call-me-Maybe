[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
]

[tool.uv.workspace]
members = [
    "llm_sdk",
]

[tool.uv.sources]
llm-sdk = { workspace = true }

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.3.1",
]

[tool.mypy]
exclude = ["^llm_sdk/", "^playground/", "^\\.venv/"]
mypy_path = "llm_sdk"

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
follow_imports = "silent"

# Don't analyse the big libraries llm_sdk uses (makes mypy much faster)
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "huggingface_hub", "huggingface_hub.*", "numpy", "numpy.*"]
follow_imports = "skip"
